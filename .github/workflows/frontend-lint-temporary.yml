name: Frontend lint verification (temporary)
on:
  push:
    branches:
      - codex/frontend-eslint-20261014-01

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate updated lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to feature branch
        shell: bash
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "chore(frontend): sync ESLint lockfile"
            git push origin HEAD:codex/frontend-eslint-20261014-01
          fi
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run lint
        working-directory: frontend
        run: npm run lint
      - name: Check TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Run tests
        working-directory: frontend
        run: npm run test:run
